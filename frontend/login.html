<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود | بازاریو</title>
<script src="assets/js/theme-init.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: { bazaar: { 950:'#131F17', 900:'#1E2F22', 800:'#2A4030', 700:'#3B5942', 600:'#55735C', 500:'#7C9382', 400:'#9AB198', 300:'#BFCCB9', 200:'#DCDDB9', 100:'#EAE3D2', 50:'#FAF6EC' }, brass: { 500:'#AD8A55', 400:'#C7A96F' } },
      fontFamily: { display: ['Amiri','serif'], body: ['Vazirmatn','sans-serif'] },
    } },
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/effects.css">
<style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="grid min-h-screen place-items-center bg-bazaar-50 px-5 py-10 text-bazaar-950 antialiased dark:bg-bazaar-950 dark:text-bazaar-100">

<div class="w-full max-w-md">
  <a href="index.html" class="mb-8 flex items-center justify-center gap-2.5">
    <span class="flex h-9 w-9 items-center justify-center rounded-full bg-bazaar-700 text-brass-400">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M 12 2.7 L 13.65 8.03 L 18.58 5.42 L 15.97 10.35 L 21.3 12 L 15.97 13.65 L 18.58 18.58 L 13.65 15.97 L 12 21.3 L 10.35 15.97 L 5.42 18.58 L 8.03 13.65 L 2.7 12 L 8.03 10.35 L 5.42 5.42 L 10.35 8.03 Z"/></svg>
    </span>
    <span class="font-display text-lg font-extrabold text-bazaar-900 dark:text-white" data-i18n="brand">بازاریو</span>
  </a>

  <div class="rounded-3xl border border-bazaar-100 bg-white p-8 shadow-sm dark:border-white/5 dark:bg-bazaar-900/40">
    <h1 class="font-display text-xl font-bold text-bazaar-950 dark:text-white" data-i18n="auth.login_title">ورود به حساب کاربری</h1>
    <p class="mt-1.5 text-sm text-bazaar-600 dark:text-bazaar-400" data-i18n="auth.login_subtitle">برای پیگیری سفارش‌ها و تعمیرات خود وارد شوید.</p>

    <p data-form-error class="hidden mt-4 rounded-lg bg-rose-50 px-3 py-2 text-xs text-rose-600 dark:bg-rose-500/10 dark:text-rose-400"></p>

    <form id="login-form" class="mt-6 space-y-4">
      <div>
        <label class="mb-1.5 block text-xs font-medium text-bazaar-700 dark:text-bazaar-300" data-i18n="auth.email">ایمیل</label>
        <input name="email" type="email" required class="w-full rounded-xl border border-bazaar-200 bg-transparent px-3.5 py-2.5 text-sm outline-none focus:border-bazaar-500 dark:border-white/10" />
      </div>
      <div>
        <label class="mb-1.5 block text-xs font-medium text-bazaar-700 dark:text-bazaar-300" data-i18n="auth.password">رمز عبور</label>
        <input name="password" type="password" required minlength="6" class="w-full rounded-xl border border-bazaar-200 bg-transparent px-3.5 py-2.5 text-sm outline-none focus:border-bazaar-500 dark:border-white/10" />
      </div>
      <button type="submit" class="w-full rounded-xl bg-bazaar-700 py-3 text-sm font-semibold text-white hover:bg-bazaar-800" data-i18n="auth.login_button">ورود</button>
      <a href="forgot-password.html" class="block text-center text-xs text-bazaar-500 hover:text-bazaar-800 dark:text-bazaar-400" data-i18n="auth.forgot_password">رمز عبور را فراموش کرده‌اید؟</a>
    </form>

    <p class="mt-6 text-center text-sm text-bazaar-600 dark:text-bazaar-400">
      <span data-i18n="auth.no_account">حساب کاربری ندارید؟</span>
      <a href="signup.html" data-auth-switch-link class="font-semibold text-bazaar-700 dark:text-bazaar-300" data-i18n="auth.go_signup">ثبت‌نام کنید</a>
    </p>
  </div>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/scroll-reveal.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/password-toggle.js"></script>
</body>
</html>
