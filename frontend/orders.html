<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سفارش‌های من | خورشید</title>
<script src="assets/js/theme-init.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: { khorshid: { 950:'#081020', 900:'#0F2A4A', 800:'#153A63', 700:'#1B4F8C', 600:'#2668AC', 500:'#3E7CB8', 300:'#8FBBDE', 100:'#E4EEF8', 50:'#F5F9FD' }, sun: { 500:'#F2A83B', 400:'#F5BE64' } },
      fontFamily: { display: ['Vazirmatn','sans-serif'], body: ['Vazirmatn','sans-serif'] },

</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Vazirmatn', sans-serif; }
  .font-mono { font-family: '"IBM Plex Mono"', monospace; }
</style>
</head>
<body class="bg-khorshid-50 text-khorshid-950 antialiased dark:bg-khorshid-950 dark:text-khorshid-100">

<header class="sticky top-0 z-40 border-b border-khorshid-100/80 bg-khorshid-50/90 backdrop-blur dark:border-white/5 dark:bg-khorshid-950/90">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-3.5">
    <a href="index.html" class="flex items-center gap-2.5">
      <span class="flex h-9 w-9 items-center justify-center rounded-full bg-khorshid-700 text-sun-400">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </span>
      <span class="font-display text-lg font-extrabold text-khorshid-900 dark:text-white" data-i18n="brand">خورشید</span>
    </a>
    <div class="flex items-center gap-2">
      <button data-lang-toggle class="rounded-full border border-khorshid-200 px-3 py-1.5 text-xs font-semibold text-khorshid-700 hover:bg-khorshid-100 dark:border-white/10 dark:text-khorshid-200 dark:hover:bg-white/5">
        <span data-lang-label>English</span>
      </button>
      <button data-theme-toggle class="grid h-9 w-9 place-items-center rounded-full border border-khorshid-200 text-sm hover:bg-khorshid-100 dark:border-white/10 dark:hover:bg-white/5">
        <span data-theme-icon>🌙</span>
      </button>
    </div>
  </div>
</header>

<section class="mx-auto max-w-4xl px-5 py-10">
  <h1 class="font-display text-2xl font-bold text-khorshid-950 dark:text-white" data-i18n="orders_page.title">سفارش‌های من</h1>
  <p class="mt-2 text-sm text-khorshid-600 dark:text-khorshid-400" data-i18n="orders_page.subtitle">وضعیت و جزئیات سفارش‌های ثبت‌شده شما.</p>

  <div id="orders-empty" class="hidden mt-12 flex flex-col items-center gap-3 text-center text-khorshid-500 dark:text-khorshid-400">
    <p data-i18n="orders_page.empty">هنوز سفارشی ثبت نکرده‌اید.</p>
    <a href="products.html" class="rounded-full bg-khorshid-700 px-5 py-2.5 text-sm font-semibold text-white hover:bg-khorshid-800" data-i18n="cart_page.browse_products">مشاهده محصولات</a>
  </div>

  <div id="orders-list" class="mt-8 space-y-4"></div>
</section>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/orders.js"></script>

</html>
