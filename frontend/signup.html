<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ثبت‌نام | بازاریو</title>
<script src="assets/js/theme-init.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      colors: { bazaar: { 950:'#1C140D', 900:'#2E2015', 800:'#43301E', 700:'#5C4229', 600:'#7A5C3C', 500:'#9C7C52', 400:'#C0A576', 300:'#DCC9A0', 200:'#EDE0C4', 100:'#F6EEDC', 50:'#FCF8EF' }, brass: { 700:'#8A6A3A', 600:'#9C7A46', 500:'#B8935A', 400:'#D4B678', 300:'#E4CDA0' }, forest: { 900:'#0E1B12', 800:'#142519', 700:'#1B3327', 600:'#234230', 500:'#33573F', 400:'#4F7A5E', 300:'#7FA184', 100:'#DCE6DC' }, oxblood: { 800:'#3A1212', 700:'#4A1717', 600:'#62201F', 500:'#7D2E2E', 400:'#A24B4B', 300:'#C77E7E' } },
      fontFamily: { display: ['Amiri','serif'], body: ['Vazirmatn','sans-serif'] },
    } },
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/effects.css">
<style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="grid min-h-screen place-items-center bg-bazaar-50 px-5 py-10 text-bazaar-950 antialiased dark:bg-bazaar-950 dark:text-bazaar-100">

<div class="w-full max-w-md">
  <a href="index.html" class="mb-8 flex items-center justify-center gap-2.5">
    <span class="flex h-9 w-9 items-center justify-center rounded-full bg-forest-700 text-brass-400">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M 12 2.7 L 13.65 8.03 L 18.58 5.42 L 15.97 10.35 L 21.3 12 L 15.97 13.65 L 18.58 18.58 L 13.65 15.97 L 12 21.3 L 10.35 15.97 L 5.42 18.58 L 8.03 13.65 L 2.7 12 L 8.03 10.35 L 5.42 5.42 L 10.35 8.03 Z"/></svg>
    </span>
    <span class="font-display text-lg font-extrabold text-bazaar-900 dark:text-white" data-i18n="brand">بازاریو</span>
  </a>

  <div class="rounded-3xl border border-bazaar-100 bg-white p-8 shadow-sm dark:border-white/5 dark:bg-bazaar-900/40">
    <h1 class="font-display text-xl font-bold text-bazaar-950 dark:text-white" data-i18n="auth.signup_title">ساخت حساب کاربری</h1>
    <p class="mt-1.5 text-sm text-bazaar-600 dark:text-bazaar-400" data-i18n="auth.signup_subtitle">ثبت‌نام رایگان است و کمتر از یک دقیقه طول می‌کشد.</p>

    <p data-form-error class="hidden mt-4 rounded-lg bg-rose-50 px-3 py-2 text-xs text-rose-600 dark:bg-rose-500/10 dark:text-rose-400"></p>

    <form id="signup-form" class="mt-6 space-y-4">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="mb-1.5 block text-xs font-medium text-bazaar-700 dark:text-bazaar-300" data-i18n="auth.first_name">نام</label>
          <input name="first_name" type="text" required class="w-full rounded-xl border border-bazaar-200 bg-transparent px-3.5 py-2.5 text-sm outline-none focus:border-bazaar-500 dark:border-white/10" />
        </div>
        <div>
          <label class="mb-1.5 block text-xs font-medium text-bazaar-700 dark:text-bazaar-300" data-i18n="auth.last_name">نام خانوادگی</label>
          <input name="last_name" type="text" required class="w-full rounded-xl border border-bazaar-200 bg-transparent px-3.5 py-2.5 text-sm outline-none focus:border-bazaar-500 dark:border-white/10" />
        </div>
      </div>
      <div>
        <label class="mb-1.5 block text-xs font-medium text-bazaar-700 dark:text-bazaar-300" data-i18n="auth.email">ایمیل</label>
        <input name="email" type="email" required class="w-full rounded-xl border border-bazaar-200 bg-transparent px-3.5 py-2.5 text-sm outline-none focus:border-bazaar-500 dark:border-white/10" />
      </div>
      <div>
        <label class="mb-1.5 block text-xs font-medium text-bazaar-700 dark:text-bazaar-300" data-i18n="auth.password">رمز عبور</label>
        <input name="password" type="password" required minlength="6" class="w-full rounded-xl border border-bazaar-200 bg-transparent px-3.5 py-2.5 text-sm outline-none focus:border-bazaar-500 dark:border-white/10" />
        <p class="mt-1 text-[11px] text-bazaar-500 dark:text-bazaar-400" data-i18n="auth.password_hint">حداقل ۶ کاراکتر</p>
      </div>
      <button type="submit" class="w-full rounded-xl bg-forest-700 py-3 text-sm font-semibold text-white hover:bg-forest-800" data-i18n="auth.signup_button">ساخت حساب</button>
    </form>

    <p class="mt-6 text-center text-sm text-bazaar-600 dark:text-bazaar-400">
      <span data-i18n="auth.have_account">قبلاً ثبت‌نام کرده‌اید؟</span>
      <a href="login.html" data-auth-switch-link class="font-semibold text-bazaar-700 dark:text-bazaar-300" data-i18n="auth.go_login">وارد شوید</a>
    </p>
  </div>
</div>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/scroll-reveal.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/password-toggle.js"></script>
</body>
</html>
